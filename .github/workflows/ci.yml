name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keplar
          POSTGRES_PASSWORD: keplar
          POSTGRES_DB: keplar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keplar" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://keplar:keplar@localhost:5432/keplar_test
      E2E_DATABASE_URL: postgres://keplar:keplar@localhost:5432/keplar_e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests (real Postgres)
        run: npm test
      - name: Build
        run: npm run build
      - name: "Dependency audit (release gate: no high or critical)"
        run: npm audit --audit-level=high
      - name: Secret scan (local patterns)
        run: npm run scan:secrets
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: End-to-end and accessibility tests
        run: |
          PGPASSWORD=keplar psql -h localhost -U keplar -d keplar_test -c "CREATE DATABASE keplar_e2e"
          npx playwright install --with-deps chromium
          npm run test:e2e

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
